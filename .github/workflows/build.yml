name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install PyQt5 paramiko scp pyinstaller

      - name: 构建 EXE
        run: python build.py

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: SSHComposer
          path: dist/SSHComposer.exe
